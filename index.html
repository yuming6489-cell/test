<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5dd"><meta name="description" content="熊貓打棕熊屁屁！可愛又無厘頭的免費網頁小遊戲。">
<title>熊貓啪屁屁！｜Panda Bonk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
:root{--ink:#3c3029;--pink:#fc6d8a;--cream:#fff9ea;--orange:#ffba58}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink)}body{background:radial-gradient(ellipse at 15% 10%,#ffefd9 0,transparent 40%),radial-gradient(ellipse at 90% 80%,#ffe3d8 0,transparent 35%),#fff8e8;display:flex;justify-content:center;align-items:center;padding:22px 12px;overflow-x:hidden}.wrap{width:min(1050px,100%)}header{text-align:center;margin-bottom:12px}.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid #e8d6b8;border-radius:99px;padding:5px 15px;font-size:12px;font-weight:900;letter-spacing:2px}h1{font-size:clamp(36px,7vw,65px);margin:5px 0 0;line-height:1.15;letter-spacing:2px;text-shadow:3px 5px 0 #ffdfa8}header p{margin:8px 0 0;font-size:14px;color:#937766;font-weight:800}.shell{background:#fffdfa;border:3px solid #45372f;border-radius:30px;padding:13px;box-shadow:0 12px 0 #e6d5b7,0 24px 42px #78592922}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}.stat{display:flex;align-items:center;justify-content:space-between;background:#fff5e2;border:2px solid #eddcbf;border-radius:16px;padding:11px 16px;font-size:14px;font-weight:900}.stat strong{font-size:25px;font-variant-numeric:tabular-nums}.stat:nth-child(2){background:#fff0f3}.stat:nth-child(3){background:#ebf7ed}.board{border:3px solid #473930;border-radius:23px;position:relative;overflow:hidden;background:#c9ebea;touch-action:manipulation;user-select:none}.board canvas{display:block;width:100%;height:auto;aspect-ratio: 960/530;cursor:crosshair}.overlay{position:absolute;inset:0;background:#2d2722a6;display:grid;place-items:center;padding:20px;z-index:3;backdrop-filter:blur(3px)}.overlay.hidden{display:none}.modal{background:#fffaf0;border:4px solid #3d3029;border-radius:28px;box-shadow:8px 9px 0 #34292355;max-width:440px;width:100%;padding:26px 20px;text-align:center;animation:pop .25s ease-out}.emoji{font-size:55px}.modal h2{font-size:clamp(26px,4vw,37px);line-height:1.2;margin:12px 0}.modal p{line-height:1.8;color:#8c7466;font-size:15px;font-weight:800}.button{cursor:pointer;border:3px solid #3d3029;border-radius:16px;padding:14px 30px;font:900 20px Nunito,'Microsoft JhengHei',sans-serif;background:#ffcb5d;color:#453226;box-shadow:0 5px 0 #3d3029;transition:transform .12s,box-shadow .12s}.button:hover{transform:translateY(2px);box-shadow:0 3px 0 #3d3029}.button:active{transform:translateY(5px);box-shadow:none}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap}.tip{font-size:13px;font-weight:800;color:#7c695f}.smallbtn{border:2px solid #e5d5c5;background:white;border-radius:12px;padding:9px 14px;font:900 13px inherit;cursor:pointer;color:#59463a}.smallbtn:hover{background:#fff0dc}.footer{text-align:center;color:#9e8874;font-size:12px;margin-top:18px;font-weight:800}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:610px){body{padding:15px 8px}.shell{padding:8px;border-radius:22px}.hud{gap:5px}.stat{border-radius:12px;display:block;text-align:center;padding:6px 3px;font-size:11px}.stat strong{display:block;font-size:21px}.board{border-radius:14px}.tip{font-size:11px}.controls{justify-content:center}.modal{padding:20px 12px}.modal p{font-size:13px}header p{font-size:12px}}
</style>
</head>
<body>
<main class="wrap"><header><span class="eyebrow">🐼 PANDA BONK! 🐻</span><h1>熊貓啪屁屁！</h1><p>瞄準棕熊的圓屁屁，啪！啪！啪！一起來挑戰最高分</p></header>
<section class="shell"><div class="hud"><div class="stat"><span>🍑 得分</span><strong id="score">0</strong></div><div class="stat"><span>⏱️ 剩餘秒數</span><strong id="timer">30</strong></div><div class="stat"><span>🏆 最高紀錄</span><strong id="best">0</strong></div></div>
<div class="board"><canvas id="game" width="960" height="530" aria-label="熊貓打棕熊屁屁遊戲畫面"></canvas><div class="overlay" id="overlay"><div class="modal"><div class="emoji" id="modalEmoji">🐼🍑🐻</div><h2 id="modalTitle">準備好啪屁屁了嗎？</h2><p id="modalText">30 秒內，點擊棕熊的屁屁賺分！<br>連續命中可以獲得連擊加分。<br>手機點一下、電腦滑鼠點擊都能玩！</p><button class="button" id="startBtn">開始遊戲 ▶</button></div></div></div>
<div class="controls"><span class="tip">🎯 點棕熊的屁屁得分　✨ 連擊越多分數越高</span><div><button class="smallbtn" id="soundBtn" type="button">🔊 音效開啟</button> <button class="smallbtn" id="resetBtn" type="button">↻ 重新開始</button></div></div></section><div class="footer">Made with 🐼 & 🍑 · 純 HTML / CSS / JavaScript · 支援 GitHub Pages</div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#timer'),bestEl=document.querySelector('#best'),soundBtn=document.querySelector('#soundBtn');
const W=960,H=530;let score=0,timeLeft=30,best=0,active=false,startTime=0,lastFrame=0,streak=0,muted=false,audio=null,particles=[],floaters=[],clouds=[{x:80,y:110,s:1},{x:395,y:73,s:.65},{x:780,y:102,s:1.2}],swing=0,flash=0,missFlash=0,hitCount=0;let bear={x:680,y:318,tx:680,ty:318,phase:0,speed:1};let pointer={x:350,y:270};
try{best=Number(localStorage.getItem('panda-bonk-best')||0)}catch(e){}bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a);const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
function ellipse(x,y,rx,ry,color,angle=0){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,angle,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,col,width){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(t,x,y,size,col='#453329',stroke){ctx.font=`900 ${size}px Nunito, 'Microsoft JhengHei', sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=7;ctx.strokeStyle=stroke;ctx.strokeText(t,x,y)}ctx.fillStyle=col;ctx.fillText(t,x,y)}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,15,66,17,'#ffffffb8');ellipse(-32,4,27,24,'#ffffffd9');ellipse(5,-9,39,34,'#ffffffd9');ellipse(39,6,29,23,'#ffffffd9');ctx.restore()}
function background(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b9e6ed');g.addColorStop(1,'#edf7d4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ellipse(810,70,39,39,'#fff6b5');clouds.forEach((c,i)=>cloud((c.x+t*(i%2?5:9))%(W+180)-80,c.y,c.s));ellipse(185,455,420,125,'#a4d7a1');ellipse(750,464,470,141,'#92c68d');ctx.fillStyle='#6dab7d';ctx.fillRect(0,445,W,85);ellipse(445,490,590,110,'#81bc77');for(let i=0;i<14;i++){const x=i*75+30;line(x,475+(i%3)*12,x-3,465+(i%3)*12,'#589659',3);ellipse(x-7,464+(i%3)*12,4,4,i%3?'#fff5ad':'#ffc9d7');ellipse(x+3,465+(i%3)*12,4,4,'#ffffff')};}
function panda(t){const bob=Math.sin(t*2.6)*3;ctx.save();ctx.translate(315,353+bob);ellipse(0,111,128,22,'#50774d55');ellipse(-58,89,37,26,'#29292d',-.25);ellipse(62,89,37,26,'#29292d',.25);ellipse(0,35,94,101,'#f9f7ee');ellipse(-77,10,33,67,'#29292d',-.35);ellipse(78,9,33,67,'#29292d',.35);ellipse(0,-81,89,83,'#fffdf4');ellipse(-64,-144,29,32,'#27272c',-.5);ellipse(64,-144,29,32,'#27272c',.5);ellipse(-37,-88,29,36,'#353438',.28);ellipse(37,-88,29,36,'#353438',-.28);ellipse(-34,-89,10,13,'#fff');ellipse(34,-89,10,13,'#fff');ellipse(-30,-88,5,7,'#27272c');ellipse(40,-88,5,7,'#27272c');ellipse(0,-49,16,12,'#29292d');ctx.strokeStyle='#544e4d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(-10,-40,12,.2,1.5);ctx.stroke();ctx.beginPath();ctx.arc(10,-40,12,1.65,3);ctx.stroke();ellipse(-66,-56,17,9,'#f8aab7a6');ellipse(67,-56,17,9,'#f8aab7a6');ctx.save();ctx.translate(70,-4);ctx.rotate(-.35-swing*.75);ellipse(4,5,30,27,'#2b2a2b');line(18,-8,89,-111,'#ac7144',18);ellipse(98,-121,37,26,'#ffcb65',-.5);ellipse(104,-120,28,18,'#ffd985',-.5);ctx.restore();ctx.restore()}
function brownBear(t){const bob=Math.sin(t*4+bear.phase)*5;ctx.save();ctx.translate(bear.x,bear.y+bob);ellipse(0,117,136,22,'#50774d55');ellipse(-74,91,33,31,'#77462d');ellipse(71,91,33,31,'#77462d');ellipse(0,12,116,109,'#98603c');ellipse(-83,-79,27,28,'#875031');ellipse(-83,-79,14,14,'#ca9376');ellipse(83,-79,27,28,'#875031');ellipse(83,-79,14,14,'#ca9376');ellipse(0,-56,100,78,'#a56b45');ellipse(-39,-64,9,10,'#3f2a23');ellipse(43,-64,9,10,'#3f2a23');ellipse(-42,-67,3,3,'#fff');ellipse(40,-67,3,3,'#fff');ellipse(0,-36,40,30,'#dfae81');ellipse(0,-49,15,10,'#4a3026');ctx.strokeStyle='#593726';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-37,16,.2,Math.PI-.2);ctx.stroke();ellipse(-66,-39,18,11,'#f29b94a8');ellipse(69,-39,18,11,'#f29b94a8');ellipse(-108,12,26,52,'#8a5233',-.25);ellipse(108,12,26,52,'#8a5233',.25);
// round target, framed as cartoon bear's rump
ellipse(0,67,91,68,'#b97950');ellipse(-39,72,53,51,'#ce9268');ellipse(39,72,53,51,'#ce9268');ellipse(0,58,12,13,'#815037');ellipse(0,80,9,14,'#eaa7a0');if(active){ctx.save();ctx.setLineDash([10,10]);ctx.strokeStyle='#fff7bd';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,70,93,67,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore()}if(flash>0){ellipse(-43,73,48,45,`rgba(255,98,135,${flash*.3})`);ellipse(40,73,48,45,`rgba(255,98,135,${flash*.3})`)}ctx.restore()}
function effects(dt){particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.max);text(p.char,p.x,p.y,p.size,p.color);ctx.globalAlpha=1});floaters=floaters.filter(f=>f.life>0);floaters.forEach(f=>{f.y-=65*dt;f.life-=dt;ctx.globalAlpha=Math.min(1,f.life*2);text(f.str,f.x,f.y,30,f.color,'#fff8e4');ctx.globalAlpha=1})}
function sound(freq=360){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*.52,now+.13);gain.gain.setValueAtTime(.13,now);gain.gain.exponentialRampToValueAtTime(.001,now+.16);o.connect(gain);gain.connect(audio.destination);o.start(now);o.stop(now+.17)}catch(e){}}
function hit(){streak++;hitCount++;let amount=10+Math.min(streak-1,10)*2;score+=amount;scoreEl.textContent=score;flash=1;swing=1;sound(330+Math.min(streak,12)*42);const x=bear.x,y=bear.y+60;floaters.push({str:`+${amount}${streak>=3?' 連擊!':''}`,x,y:y-65,life:.9,color:'#ff5178'});for(let i=0;i<14;i++){let a=rand(-Math.PI,Math.PI),speed=rand(70,250);particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-70,life:rand(.4,1),max:1,char:Math.random()>.5?'✦':'♥',size:rand(14,27),color:Math.random()>.5?'#ff6c91':'#ffd15c'})}bear.tx=rand(595,790);bear.ty=rand(270,340);bear.phase=rand(0,6)}
function tap(e){if(!active)return;const bounds=canvas.getBoundingClientRect(),x=(e.clientX-bounds.left)/bounds.width*W,y=(e.clientY-bounds.top)/bounds.height*H;pointer={x,y};const by=bear.y+Math.sin(performance.now()/1000*4+bear.phase)*5;let inside=Math.pow((x-bear.x)/100,2)+Math.pow((y-(by+67))/77,2)<1;if(inside)hit();else{streak=0;missFlash=.7;swing=.7;sound(160);floaters.push({str:'哎呀！',x,y:y-16,life:.6,color:'#665447'})}}
function end(){active=false;let record=score>best;if(record){best=score;bestEl.textContent=best;try{localStorage.setItem('panda-bonk-best',String(best))}catch(e){}}document.querySelector('#modalEmoji').textContent=record?'🏆🐼🎉':'🐼🍑🐻';document.querySelector('#modalTitle').textContent=record?'新紀錄！太會啪了！':'時間到！';document.querySelector('#modalText').innerHTML=`你獲得了 <b style="font-size:28px;color:#ff6686">${score}</b> 分！<br>${record?'恭喜刷新最高紀錄！':'再來一次，挑戰更高分！'}`;document.querySelector('#startBtn').textContent='再玩一次 ↻';overlay.classList.remove('hidden')}
function start(){score=0;streak=0;hitCount=0;timeLeft=30;scoreEl.textContent=0;timeEl.textContent=30;particles=[];floaters=[];bear.x=680;bear.y=318;bear.tx=680;bear.ty=318;startTime=performance.now();active=true;overlay.classList.add('hidden');sound(540)}
function loop(ms){const t=ms/1000,dt=Math.min((ms-lastFrame)/1000||0,.04);lastFrame=ms;if(active){timeLeft=Math.max(0,30-(ms-startTime)/1000);timeEl.textContent=Math.ceil(timeLeft);if(timeLeft<=0)end();bear.x+=(bear.tx-bear.x)*Math.min(1,dt*5);bear.y+=(bear.ty-bear.y)*Math.min(1,dt*5);if(Math.abs(bear.x-bear.tx)<2&&Math.random()<dt*.42){bear.tx=rand(590,800);bear.ty=rand(275,330)}}swing=Math.max(0,swing-dt*3.5);flash=Math.max(0,flash-dt*3);missFlash=Math.max(0,missFlash-dt*2);ctx.clearRect(0,0,W,H);background(t);panda(t);brownBear(t);if(active){text('👆 點這裡！',bear.x,bear.y-130,24,'#754b31','#fff8e5');if(streak>=3)text(`🔥 ${streak} COMBO`,480,42,26,'#e96563','#fffaf1')}if(missFlash>0){ctx.fillStyle=`rgba(255,255,255,${missFlash*.08})`;ctx.fillRect(0,0,W,H)}effects(dt);requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',tap);document.querySelector('#startBtn').addEventListener('click',start);document.querySelector('#resetBtn').addEventListener('click',start);soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.textContent=muted?'🔇 音效關閉':'🔊 音效開啟'});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!active)start();else hit()}});requestAnimationFrame(loop);
})();
</script></body></html>
